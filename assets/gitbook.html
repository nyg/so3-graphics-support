<script>
(() => {
  const STORAGE_KEY = "gitbook-settings";
  const FONT_SIZES = [14, 16, 18, 20, 22];
  const THEMES = ["white", "sepia", "night"];
  const defaults = { size: 1, family: "sans", theme: "white", sidebar: true };

  const load = () => {
    try {
      return { ...defaults, ...JSON.parse(localStorage.getItem(STORAGE_KEY)) };
    } catch {
      return { ...defaults };
    }
  };

  const save = (settings) => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
    } catch {}
  };

  const settings = load();

  const apply = () => {
    const main = document.querySelector("main.content");
    if (main) main.style.fontSize = FONT_SIZES[settings.size] + "px";
    document.body.classList.toggle("gb-serif", settings.family === "serif");
    document.body.classList.toggle("gb-sepia", settings.theme === "sepia");
    document.body.classList.toggle("gb-night", settings.theme === "night");
    document.body.classList.toggle("gb-sidebar-hidden", !settings.sidebar);
    document.querySelectorAll(".gb-font-panel [data-family]").forEach((b) =>
      b.classList.toggle("active", b.dataset.family === settings.family));
    document.querySelectorAll(".gb-font-panel [data-theme]").forEach((b) =>
      b.classList.toggle("active", b.dataset.theme === settings.theme));
  };

  const update = (change) => {
    Object.assign(settings, change);
    save(settings);
    apply();
  };

  const button = (content, label, onClick) => {
    const b = document.createElement("button");
    b.type = "button";
    b.title = label;
    b.setAttribute("aria-label", label);
    b.innerHTML = content.startsWith("bi-") ? `<i class="bi ${content}"></i>` : content;
    b.addEventListener("click", onClick);
    return b;
  };

  const fontPanel = () => {
    const panel = document.createElement("div");
    panel.className = "gb-font-panel";
    panel.hidden = true;
    panel.innerHTML = `
      <div class="gb-font-row">
        <button type="button" data-size="-1" style="font-size: 12px">A</button>
        <button type="button" data-size="1" style="font-size: 18px">A</button>
      </div>
      <div class="gb-font-row">
        <button type="button" data-family="serif" style="font-family: Georgia, serif">Serif</button>
        <button type="button" data-family="sans">Sans</button>
      </div>
      <div class="gb-font-row">
        ${THEMES.map((t) => `<button type="button" data-theme="${t}">${t[0].toUpperCase() + t.slice(1)}</button>`).join("")}
      </div>`;
    panel.addEventListener("click", (event) => {
      const b = event.target.closest("button");
      if (!b) return;
      if (b.dataset.size) {
        const size = Math.min(FONT_SIZES.length - 1, Math.max(0, settings.size + Number(b.dataset.size)));
        update({ size });
      }
      if (b.dataset.family) update({ family: b.dataset.family });
      if (b.dataset.theme) update({ theme: b.dataset.theme });
    });
    return panel;
  };

  const openSearch = () => {
    const trigger = document.querySelector("#quarto-search .aa-DetachedSearchButton, #quarto-search button, #quarto-search input");
    if (trigger) {
      trigger.click();
      trigger.focus?.();
    }
  };

  const buildHeader = (main) => {
    const header = document.createElement("div");
    header.className = "gb-header";
    const panel = fontPanel();

    header.append(
      button("bi-list", "Toggle sidebar", () => update({ sidebar: !settings.sidebar })),
      button("bi-search", "Search", openSearch),
      button("<span style=\"font-family: Georgia, serif\">A</span>", "Font settings", (event) => {
        event.stopPropagation();
        panel.hidden = !panel.hidden;
      }),
    );

    const edit = document.querySelector(".quarto-repo-action-edit, a[href*='/edit/']");
    if (edit) {
      header.append(button("bi-pencil-square", "Edit this page", () => window.open(edit.href, "_blank")));
    }

    const pdf = document.querySelector("#quarto-sidebar a[href$='.pdf']");
    if (pdf) {
      header.append(button("bi-file-earmark-pdf", "Download PDF", () => { window.location.href = pdf.href; }));
    }

    const title = document.createElement("span");
    title.className = "gb-title";
    title.textContent = document.querySelector(".sidebar-title")?.textContent.trim() ?? document.title;
    header.append(title, panel);

    document.addEventListener("click", (event) => {
      if (!panel.contains(event.target)) panel.hidden = true;
    });

    main.prepend(header);
  };

  const buildSectionList = (main) => {
    const active = document.querySelector("#quarto-sidebar .sidebar-link.active");
    const headings = [...main.querySelectorAll("section.level2 > h2")];
    if (!active || headings.length === 0) return;

    const list = document.createElement("ul");
    list.className = "gb-sections";
    headings.forEach((h) => {
      const id = h.parentElement.id;
      if (!id) return;
      const number = h.querySelector(".header-section-number")?.textContent ?? "";
      const text = [...h.childNodes]
        .filter((n) => !(n.classList?.contains("header-section-number") || n.classList?.contains("anchorjs-link")))
        .map((n) => n.textContent)
        .join("")
        .trim();
      const li = document.createElement("li");
      li.innerHTML = `<a href="#${id}">${number ? `<span class="gb-section-number">${number}</span>` : ""}${text}</a>`;
      list.append(li);
    });
    active.closest("li").append(list);
  };

  const buildSideNavigation = () => {
    [["previous", "gb-prev", "bi-chevron-left"], ["next", "gb-next", "bi-chevron-right"]].forEach(([which, cls, icon]) => {
      const link = document.querySelector(`.page-navigation .nav-page-${which} a`);
      if (!link) return;
      const a = document.createElement("a");
      a.className = `gb-nav ${cls}`;
      a.href = link.href;
      a.setAttribute("aria-label", which === "previous" ? "Previous chapter" : "Next chapter");
      a.innerHTML = `<i class="bi ${icon}"></i>`;
      document.body.append(a);
    });
  };

  document.addEventListener("DOMContentLoaded", () => {
    const main = document.querySelector("main.content");
    if (!main) return;
    buildHeader(main);
    buildSectionList(main);
    buildSideNavigation();
    apply();
  });
})();
</script>
