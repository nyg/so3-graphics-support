<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-labelledby="t">
  <title id="t">Where the video SRAM sits in the motherboard's memory map</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6b77"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; fill: #333; text-anchor: middle; }
    .area { font-size: 12px; fill: #7e888b; letter-spacing: 0.08em; }
    .addr { font-family: Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #5c6b77; text-anchor: end; }
    .mono { font-family: Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; }
    .muted { fill: #7e888b; }
    .bold { font-weight: bold; }
    .slice { fill: #fff; stroke: #5c6b77; stroke-width: 1.5; }
    .slice-hl { fill: #eaf2fb; stroke: #4183c4; stroke-width: 1.5; }
    .zoom { fill: #fafafa; stroke: #d5dbe0; }
    .vram { fill: #eaf2fb; stroke: #4183c4; stroke-width: 1.5; }
    .other { fill: #fff; stroke: #9aa5ae; stroke-width: 1.5; }
    .guide { stroke: #9aa5ae; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
    .edge { stroke: #5c6b77; stroke-width: 1.5; fill: none; }
  </style>

  <text class="area" x="185" y="22">MOTHERBOARD MEMORY MAP</text>

  <rect class="slice" x="110" y="40" width="150" height="32.5"/>
  <text x="185" y="61">CS3</text>
  <rect class="slice-hl" x="110" y="72.5" width="150" height="32.5"/>
  <text class="bold" x="185" y="94">CS2</text>
  <rect class="slice" x="110" y="105" width="150" height="32.5"/>
  <text x="185" y="126">CS1</text>
  <rect class="slice" x="110" y="137.5" width="150" height="32.5"/>
  <text x="185" y="159">CS5</text>
  <rect class="slice" x="110" y="170" width="150" height="32.5"/>
  <text x="185" y="191">CS4</text>
  <rect class="slice" x="110" y="202.5" width="150" height="32.5"/>
  <text x="185" y="224">CS0</text>
  <rect class="slice" x="110" y="235" width="150" height="32.5"/>
  <text class="muted" x="185" y="256">Reserved</text>
  <rect class="slice" x="110" y="267.5" width="150" height="32.5"/>
  <text x="185" y="289">CS0</text>

  <text class="addr" x="102" y="44">0x20000000</text>
  <text class="addr" x="102" y="76">0x1C000000</text>
  <text class="addr bold" x="102" y="109" style="fill: #4183c4">0x18000000</text>
  <text class="addr" x="102" y="141">0x14000000</text>
  <text class="addr" x="102" y="174">0x10000000</text>
  <text class="addr" x="102" y="206">0x0C000000</text>
  <text class="addr" x="102" y="239">0x08000000</text>
  <text class="addr" x="102" y="271">0x04000000</text>
  <text class="addr" x="102" y="304">0x00000000</text>

  <path class="guide" d="M260,72.5 L390,50 M260,105 L390,280"/>

  <rect class="zoom" x="390" y="50" width="300" height="230" rx="8"/>
  <text class="bold" x="540" y="76">CS2</text>
  <text class="mono muted" x="540" y="94">base 0x18000000</text>

  <rect class="vram" x="410" y="110" width="260" height="62" rx="6"/>
  <text class="bold" x="540" y="134">Video SRAM</text>
  <text class="mono" x="540" y="155">+0x00000000–0x01FFFFFF</text>

  <rect class="other" x="410" y="186" width="260" height="36" rx="6"/>
  <text class="mono muted" x="540" y="209">Ethernet  +0x02000000</text>
  <rect class="other" x="410" y="230" width="260" height="36" rx="6"/>
  <text class="mono muted" x="540" y="253">USB  +0x03000000</text>

  <path class="edge" d="M670,141 H718" marker-end="url(#arrow)"/>
  <text class="area" x="805" y="118">VRAM</text>
  <text class="mono bold" x="805" y="140">0x18000000</text>
  <text class="mono" x="805" y="156">to 0x19FFFFFF</text>
  <text class="muted" x="805" y="176" style="font-size: 12px">32 MB</text>
</svg>
