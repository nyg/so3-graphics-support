<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" width="860" height="310" role="img" aria-labelledby="t">
  <title id="t">Each ME allocates its own framebuffer memory and grants the agency access to it</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6b77"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13px; fill: #333; text-anchor: middle; }
    .title { font-size: 14px; font-weight: bold; text-anchor: start; }
    .note { font-size: 12px; fill: #7e888b; }
    .muted { fill: #7e888b; }
    .box { fill: #fafafa; stroke: #d5dbe0; }
    .node { fill: #fff; stroke: #5c6b77; stroke-width: 1.5; }
    .node-new { fill: #eaf2fb; stroke: #4183c4; stroke-width: 1.5; }
    .edge { stroke: #5c6b77; stroke-width: 1.5; fill: none; }
    .active { stroke: #4183c4; stroke-width: 2.5; fill: none; }
    .inactive { stroke: #9aa5ae; stroke-width: 1.5; fill: none; stroke-dasharray: 3 4; }
  </style>
  <defs>
    <marker id="arrow-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4183c4"/>
    </marker>
    <marker id="arrow-inactive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa5ae"/>
    </marker>
  </defs>

  <rect class="box" x="20" y="20" width="410" height="270" rx="10"/>
  <text class="title" x="36" y="44">Agency</text>

  <rect class="node" x="40" y="128" width="130" height="54" rx="8"/>
  <text x="105" y="151">Displayed</text>
  <text x="105" y="168">framebuffer</text>

  <rect class="node-new" x="230" y="54" width="170" height="54" rx="8"/>
  <text x="315" y="77">Mapping of</text>
  <text x="315" y="94">ME 1's framebuffer</text>
  <text class="muted" x="315" y="160">…</text>
  <rect class="node-new" x="230" y="202" width="170" height="54" rx="8"/>
  <text x="315" y="225">Mapping of</text>
  <text x="315" y="242">ME n's framebuffer</text>

  <path class="active" d="M170,146 H200 V81 H226" marker-end="url(#arrow-active)"/>
  <path class="inactive" d="M170,164 H200 V229 H226" marker-end="url(#arrow-inactive)"/>
  <text class="note" x="200" y="270">active domain shown in blue</text>

  <rect class="box" x="500" y="20" width="340" height="110" rx="10"/>
  <text class="title" x="770" y="81">ME 1</text>
  <rect class="node-new" x="520" y="48" width="200" height="54" rx="8"/>
  <text x="620" y="80">Framebuffer memory</text>

  <text class="muted" x="670" y="160">…</text>

  <rect class="box" x="500" y="180" width="340" height="110" rx="10"/>
  <text class="title" x="770" y="241">ME n</text>
  <rect class="node-new" x="520" y="202" width="200" height="54" rx="8"/>
  <text x="620" y="234">Framebuffer memory</text>

  <path class="edge" d="M400,75 H518" marker-end="url(#arrow)"/>
  <text class="note" x="460" y="67">grant table</text>
  <text class="note" x="460" y="93">read-only</text>
  <path class="edge" d="M400,229 H518" marker-end="url(#arrow)"/>
  <text class="note" x="460" y="221">grant table</text>
  <text class="note" x="460" y="247">read-only</text>
</svg>
