<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="920" height="250" role="img" aria-labelledby="t">
  <title id="t">Input events go from the backend to the frontend through the shared ring</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6b77"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; fill: #333; text-anchor: middle; }
    .area { font-size: 12px; fill: #7e888b; letter-spacing: 0.08em; }
    .bold { font-weight: bold; }
    .mono { font-family: Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; }
    .label { font-family: Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #5c6b77; }
    .divider { stroke: #b8c0c7; stroke-width: 1; stroke-dasharray: 6 4; }
    .node { fill: #fff; stroke: #5c6b77; stroke-width: 1.5; }
    .node-new { fill: #eaf2fb; stroke: #4183c4; stroke-width: 1.5; }
    .ring { fill: #fff; stroke: #4183c4; stroke-width: 10; }
    .edge { stroke: #5c6b77; stroke-width: 1.5; fill: none; }
  </style>

  <text class="area" x="140" y="22">AGENCY</text>
  <line class="divider" x1="410" y1="10" x2="410" y2="240"/>
  <text class="area" x="665" y="22">ME</text>

  <rect class="node-new" x="20" y="96" width="210" height="56" rx="8"/>
  <text class="bold" x="125" y="119">vinputback/vinput.c</text>
  <text class="mono" x="125" y="139">vinput_pass_event</text>

  <circle class="ring" cx="330" cy="124" r="44"/>
  <text x="330" y="120" style="font-size: 13px">shared</text>
  <text x="330" y="137" style="font-size: 13px">ring</text>

  <path class="edge" d="M125,96 C125,60 230,56 292,94" marker-end="url(#arrow)"/>
  <text class="label" x="175" y="58">vinput_ring_response</text>
  <path class="edge" d="M125,152 C125,190 230,194 292,154" marker-end="url(#arrow)"/>
  <text class="label" x="175" y="202">notify_remote_via_virq</text>

  <path class="edge" d="M379,124 H448" marker-end="url(#arrow)"/>
  <text class="label" x="430" y="148">IRQ</text>

  <rect class="node-new" x="450" y="96" width="190" height="56" rx="8"/>
  <text class="bold" x="545" y="119">vinputfront/vinput.c</text>
  <text class="mono" x="545" y="139">vinput_interrupt</text>

  <rect class="node-new" x="760" y="30" width="140" height="52" rx="8"/>
  <text class="bold" x="830" y="52">so3virt_kbd.c</text>
  <text class="mono" x="830" y="71">last_key</text>
  <rect class="node-new" x="760" y="166" width="140" height="52" rx="8"/>
  <text class="bold" x="830" y="188">so3virt_mse.c</text>
  <text class="mono" x="830" y="207">state</text>

  <path class="edge" d="M640,112 C690,112 700,56 758,56" marker-end="url(#arrow)"/>
  <text class="label" x="700" y="58" style="text-anchor: end">so3virt_kbd_event</text>
  <path class="edge" d="M640,136 C690,136 700,192 758,192" marker-end="url(#arrow)"/>
  <text class="label" x="700" y="200" style="text-anchor: end">so3virt_mse_event</text>
</svg>
