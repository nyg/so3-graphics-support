<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 290" width="890" height="290" role="img" aria-labelledby="t">
  <title id="t">Initializing the vfb backend</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5c6b77"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; fill: #333; text-anchor: middle; }
    .area { font-size: 12px; fill: #7e888b; letter-spacing: 0.08em; }
    .bold { font-weight: bold; }
    .mono { font-family: Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; }
    .note { font-size: 12px; fill: #7e888b; }
    .divider { stroke: #b8c0c7; stroke-width: 1; stroke-dasharray: 6 4; }
    .node { fill: #fff; stroke: #5c6b77; stroke-width: 1.5; }
    .node-new { fill: #eaf2fb; stroke: #4183c4; stroke-width: 1.5; }
    .edge { stroke: #5c6b77; stroke-width: 1.5; fill: none; }
  </style>

  <text class="area" x="140" y="30">SOO</text>
  <line class="divider" x1="300" y1="16" x2="300" y2="280"/>
  <text class="area" x="620" y="30">LINUX</text>

  <rect class="node-new" x="30" y="110" width="230" height="90" rx="8"/>
  <text class="bold" x="145" y="138">vfb.c</text>
  <text class="mono" x="145" y="162">vfb_init</text>
  <text class="mono" x="145" y="182">vfb_fb_notifier_callback</text>

  <rect class="node" x="400" y="60" width="190" height="52" rx="8"/>
  <text class="bold" x="495" y="81">fb.h</text>
  <text class="mono" x="495" y="100">registered_fb[]</text>

  <rect class="node" x="400" y="180" width="190" height="52" rx="8"/>
  <text class="bold" x="495" y="201">fb_notify.c</text>
  <text class="mono" x="495" y="220">fb_register_client</text>

  <rect class="node" x="660" y="60" width="190" height="52" rx="8"/>
  <text class="bold" x="755" y="81">fbmem.c</text>
  <text class="mono" x="755" y="100">register_framebuffer</text>

  <rect class="node" x="660" y="180" width="190" height="52" rx="8"/>
  <text class="bold" x="755" y="201">amba-clcd.c</text>
  <text class="note" x="755" y="220">initializes the PL111</text>

  <path class="edge" d="M850,206 H872 V86 H852" marker-end="url(#arrow)"/>
  <path class="edge" d="M660,86 H592" marker-end="url(#arrow)"/>
  <text class="note" x="626" y="78">adds</text>
  <path class="edge" d="M495,112 V178" marker-end="url(#arrow)"/>
  <text class="note" x="503" y="150" style="text-anchor: start">notifies</text>

  <path class="edge" d="M260,138 H320 V86 H398" marker-end="url(#arrow)"/>
  <text class="note" x="330" y="78" style="text-anchor: start">reads</text>
  <path class="edge" d="M260,172 H320 V206 H398" marker-end="url(#arrow)"/>
  <text class="note" x="330" y="198" style="text-anchor: start">registers</text>
  <path class="edge" d="M495,232 V262 H145 V202" marker-end="url(#arrow)"/>
  <text class="note" x="330" y="278" style="text-anchor: start">notifies</text>
</svg>
