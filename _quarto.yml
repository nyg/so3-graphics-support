project:
  type: book
  output-dir: _book

book:
  title: "Graphics Support in SO3"
  author: "Nikolaos Garanis"
  site-url: https://nyg.github.io/so3-graphics-support
  repo-url: https://github.com/nyg/so3-graphics-support
  downloads: [pdf]
  page-navigation: false
  sidebar:
    style: docked
  chapters:
    - index.qmd
    - 01-introduction.qmd
    - 02-gui.qmd
    - 03-so3.qmd
    - 04-soo.qmd
    - 05-conclusion.qmd
  appendices:
    - a1-specification.qmd
    - a2-revision.qmd

lang: en
preserve-tabs: true
number-sections: true
fig-align: center

format:
  html:
    theme: assets/theme.scss
    grid:
      sidebar-width: 270px
      body-width: 720px
      margin-width: 230px
      gutter-width: 2.5rem
    toc: true
    toc-depth: 3
    link-external-newwindow: true
  typst:
    papersize: a4
    margin:
      x: 2.5cm
      y: 2.5cm
    fontsize: 10.5pt
    include-in-header:
      text: "#show block.where(fill: rgb(\"#f1f3f5\")): set align(left)"
    toc: true
    toc-depth: 2
    section-numbering: 1.1.1
