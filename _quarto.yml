project:
  type: book
  output-dir: _book
  resources:
    - assets/Support-graphique-dans-SO3.pdf

book:
  title: "Graphics Support in SO3"
  author: "Nikolaos Garanis"
  site-url: https://nyg.github.io/so3-graphics-support
  page-navigation: false
  sidebar:
    style: docked
    footer: |
      <nav class="pdf-downloads" aria-label="PDF downloads">
      <p class="pdf-downloads-title">Read as PDF</p>
      <a href="./Graphics-Support-in-SO3.pdf" class="pdf-download"><span class="pdf-download-name">This edition</span><span class="pdf-download-meta">English · revised 2026</span></a>
      <a href="./assets/Support-graphique-dans-SO3.pdf" class="pdf-download" hreflang="fr"><span class="pdf-download-name">Original thesis</span><span class="pdf-download-meta">French · July 2020</span></a>
      </nav>
      <a href="https://github.com/nyg/so3-graphics-support" class="sidebar-source"><i class="bi bi-github" aria-hidden="true"></i><span>Source on GitHub</span></a>
  chapters:
    - index.qmd
    - 01-introduction.qmd
    - 02-gui.qmd
    - 03-so3.qmd
    - 04-soo.qmd
    - 05-conclusion.qmd
  appendices:
    - a1-specification.qmd
    - a2-revision.qmd

lang: en
preserve-tabs: true
number-sections: true
fig-align: center

format:
  html:
    theme: assets/theme.scss
    grid:
      sidebar-width: 270px
      body-width: 720px
      margin-width: 230px
      gutter-width: 2.5rem
    toc: true
    toc-depth: 3
    link-external-newwindow: true
  typst:
    papersize: a4
    margin:
      x: 2.5cm
      y: 2.5cm
    fontsize: 10.5pt
    include-in-header:
      text: "#show block.where(fill: rgb(\"#f1f3f5\")): set align(left)"
    toc: true
    toc-depth: 2
    section-numbering: 1.1.1
