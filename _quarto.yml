project:
  type: book
  output-dir: _book

book:
  title: "Graphics Support in SO3"
  author: "Nikolaos Garanis"
  site-url: https://nyg.github.io/so3-graphics-support
  repo-url: https://github.com/nyg/so3-graphics-support
  repo-branch: master
  repo-actions: [edit]
  downloads: [pdf]
  page-navigation: true
  sidebar:
    style: docked
    search: true
  chapters:
    - index.qmd
    - 01-introduction.qmd
    - 02-gui.qmd

lang: en
preserve-tabs: true
number-sections: true
fig-align: center

format:
  html:
    theme: [cosmo, assets/gitbook.scss]
    grid:
      sidebar-width: 300px
      body-width: 800px
      margin-width: 0px
      gutter-width: 2rem
    toc: false
    highlight-style: github
    code-block-bg: true
    link-external-newwindow: true
    include-after-body: assets/gitbook.html
  typst:
    papersize: a4
    margin:
      x: 2.5cm
      y: 2.5cm
    fontsize: 10.5pt
    include-in-header:
      text: "#show block.where(fill: rgb(\"#f1f3f5\")): set align(left)"
    toc: true
    toc-depth: 2
    section-numbering: 1.1.1
